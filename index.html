<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="LaunchPad WorkBook 1 as a game: phonics, first and last sounds, handwriting and the alphabet.">
<meta name="theme-color" content="#4c1d95">
<title>LaunchPad Quest</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hud" id="hud" hidden>
    <button class="hud-back" id="hud-back" type="button" aria-label="Back to the map">←</button>
    <div class="hud-title" id="hud-title"></div>
    <div class="hud-stats">
      <span class="chip" id="hud-streak" title="Day streak">🔥 <b>0</b></span>
      <span class="chip" id="hud-stars" title="Stars earned">⭐ <b>0</b></span>
      <span class="chip level" id="hud-level" title="Level">Lv <b>1</b></span>
    </div>
    <button class="hud-sound" id="hud-sound" type="button" aria-label="Turn sound off" aria-pressed="true">🔊</button>
  </header>

  <main id="app" class="app"></main>

  <script type="module" src="js/main.js"></script>
  <noscript>
    <p style="padding:2rem;font:1rem/1.6 system-ui">
      LaunchPad Quest needs JavaScript switched on.
    </p>
  </noscript>
</body>
</html>
